<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <td style="border: 1px solid black; height: 150px; background-color: darkseagreen;">First cell</td>
            <td style="border: 1px solid black; height: 150px; background-color: lightsalmon;">Second cell</td>
        </tr>
    </table>
</body>
</html>
