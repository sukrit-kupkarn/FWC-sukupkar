        h1 { color: white; text-align: center; }

        .copyright { text-align: right; font-style: italic; font-family: monospace; }

        </div>
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Shopee_logo.svg" alt="Shopee" width="200">

    <p class="copyright">&copy; sukupkar 2026</p>
