<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User profile card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <h1>User Profile Card</h1>

    <div class="card">
        <img class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Golde33443.jpg" alt="Profile picture">

        <table>
            <tr>
                <td class="login">sukupkar</td>
            </tr>
            <tr>
                <td class="description">Level 1, Beginner</td>
            </tr>
            <tr>
                <td class="school">42Bangkok</td>
            </tr>
            <tr>
                <td class="social">
                    <a href="https://github.com"><img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub"></a>
                    <a href="https://x.com"><img src="https://upload.wikimedia.org/wikipedia/commons/c/ce/X_logo_2023.svg" alt="X"></a>
                    <a href="https://linkedin.com"><img src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg" alt="LinkedIn"></a>
                    <a href="https://facebook.com"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook"></a>
                </td>
            </tr>
        </table>

        <button>Contact</button>
    </div>
</body>
</html>
